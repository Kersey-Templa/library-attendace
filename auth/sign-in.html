<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Teacher Login | Library Attendance</title>

    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body class="bg-light text-dark">
    <!--  LOGIN PAGE  -->

    <main class="min-h-screen d-flex items-center justify-center px-32 py-20">
      <div class="w-100 max-w-448">
        <!--  LOGO / BRAND  -->

        <div class="text-center mb-8">
          <a href="../index.html" class="d-inline-flex items-center justify-center">
            <img class="h-64 w-64" src="../assets/images/logo/britech-logo.png" alt="Britech College Logo" />
          </a>

          <p class="text-xs font-bold text-primary mt-5">BRITECH COLLEGE</p>

          <h1 class="text-32 font-bold mt-2">Library Attendance</h1>

          <p class="text-sm text-gray mt-2">Teacher Portal</p>
        </div>

        <!--  LOGIN CARD  -->

        <section class="p-8 rounded-2xl border-2 border-dark bg-white shadow-lg">
          <!-- LOGIN HEADER -->

          <div class="mb-6">
            <p class="text-xs font-bold text-primary">TEACHER ACCESS</p>

            <h2 class="text-24 font-bold mt-2">Welcome Back</h2>

            <p class="text-sm text-gray mt-2">Sign in to manage library attendance records.</p>
          </div>

          <!--  LOGIN FORM  -->

          <form action="#" method="post">
            <!-- EMAIL -->

            <div class="mb-5">
              <label for="email" class="d-block text-sm font-bold mb-2"> Email Address </label>

              <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
                class="w-100 px-4 py-3 rounded-md border-2 border-dark bg-light text-dark"
              />
            </div>

            <!-- PASSWORD -->

            <div class="mb-5">
              <div class="d-flex items-center justify-between mb-2">
                <label for="password" class="text-sm font-bold"> Password </label>

                <a href="#" class="text-xs font-bold text-primary"> Forgot Password? </a>
              </div>

              <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                class="w-100 px-4 py-3 rounded-md border-2 border-dark bg-light text-dark"
              />
            </div>

            <!-- REMEMBER ME -->

            <div class="d-flex items-center gap-2 mb-6">
              <input id="remember" name="remember" type="checkbox" />

              <label for="remember" class="text-sm text-gray"> Remember me </label>
            </div>

            <!-- SIGN IN BUTTON -->

            <button
              type="submit"
              class="w-100 px-5 py-4 rounded-md border-2 border-dark bg-primary text-white font-bold"
            >
              🔐 &nbsp; Sign In
            </button>
          </form>

          <!--  SECURITY NOTICE  -->

          <div class="mt-6 p-4 rounded-md border-2 border-dark bg-light">
            <p class="text-xs text-gray text-center">🔒 This portal is restricted to authorized teachers.</p>
          </div>
        </section>

        <!--  BACK TO HOME  -->

        <div class="text-center mt-6">
          <a href="../index.html" class="text-sm font-bold text-dark"> ← Back to Home </a>
        </div>

        <!--  FOOTER  -->

        <p class="text-xs text-gray text-center mt-8">© 2026 Library Attendance Monitoring System</p>
      </div>
    </main>
  </body>
</html>
